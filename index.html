<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Oven Control Panel</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome để dùng các icon trực quan -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="oven-container">
        <!-- Bảng điều khiển phía trên -->
        <div class="control-panel">
            
            <!-- Nút vặn bên trái: Chọn chức năng -->
            <div class="control-group">
                <div class="knob-container">
                    <div class="knob">
                        <div class="knob-indicator"></div>
                    </div>
                </div>
                <div class="icons-grid">
                    <i class="fa-solid fa-fire active" title="Nướng trên/dưới"></i>
                    <i class="fa-solid fa-wind" title="Đối lưu (Convection)"></i>
                    <i class="fa-solid fa-pizza-slice" title="Nướng Pizza"></i>
                    <i class="fa-solid fa-bacon" title="Nướng thanh nhiệt"></i>
                </div>
            </div>

            <!-- Màn hình OLED trung tâm -->
            <div class="oled-screen">
                <div class="screen-header">
                    <span class="brand-mode">SMART OVEN PRO</span>
                    <i class="fa-solid fa-wifi wifi-icon"></i>
                </div>
                <div class="screen-body">
                    <div class="status-row">
                        <span class="label">Chế độ:</span>
                        <span class="value">Nướng gà đối lưu</span>
                    </div>
                    <div class="status-row">
                        <span class="label">Thời gian:</span>
                        <span class="value">01:45 / 02:00 (180°C)</span>
                    </div>
                    <div class="status-row">
                        <span class="label">Trạng thái:</span>
                        <span class="value active-status">Đang nướng...</span>
                    </div>
                </div>
                <!-- Thanh công cụ cảm ứng phụ dưới màn hình -->
                <div class="screen-footer-icons">
                    <i class="fa-solid fa-lightbulb" title="Đèn lò"></i>
                    <i class="fa-solid fa-clock" title="Hẹn giờ"></i>
                    <i class="fa-solid fa-temperature-high" title="Cảm biến nhiệt"></i>
                    <i class="fa-solid fa-lock" title="Khóa trẻ em"></i>
                </div>
            </div>

            <!-- Nút vặn bên phải: Chỉnh nhiệt độ -->
            <div class="control-group">
                <div class="knob-container">
                    <div class="knob right-knob">
                        <div class="knob-indicator"></div>
                    </div>
                </div>
                <div class="temp-labels">
                    <span>50°C</span>
                    <span>100°C</span>
                    <span class="highlight-temp">180°C</span>
                    <span>230°C</span>
                    <span>250°C</span>
                </div>
            </div>

        </div>

        <!-- Cửa kính lò nướng (Hiệu ứng khoang lò bên trong) -->
        <div class="oven-door">
            <div class="handle-bar"></div>
            <div class="window-glass">
                <div class="interior-light">
                    <!-- Mô phỏng thực phẩm bên trong lò -->
                    <div class="roasted-chicken">
                        <i class="fa-solid fa-utensils"></i>
                        <span>Đang nướng gà vàng giòn</span>
                    </div>
                </div>
            </div>
            <div class="oven-brand">
                <span>Miele</span>
                <span class="sub-brand">Generation 7000</span>
            </div>
        </div>
    </div>

</body>
</html>
