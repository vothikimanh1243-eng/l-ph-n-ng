<!DOCTYPE html>
<html lang="vi">
    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: #121212;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.oven-container {
    width: 650px;
    background: #1a1a1a;
    border-radius: 8px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.7);
    overflow: hidden;
    border: 2px solid #333;
}

/* Bảng điều khiển */
.control-panel {
    background: linear-gradient(135deg, #2b2b2b 0%, #1a1a1a 100%);
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 4px solid #0f0f0f;
}

.control-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

/* Thiết kế Nút vặn (Knob) */
.knob-container {
    position: relative;
    width: 65px;
    height: 65px;
    background: radial-gradient(circle, #444 0%, #222 70%, #111 100%);
    border-radius: 50%;
    box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,255,255,0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

.knob {
    width: 50px;
    height: 50px;
    background: #1c1c1c;
    border-radius: 50%;
    position: relative;
    box-shadow: inset 0 3px 5px rgba(0,0,0,0.8);
}

.knob-indicator {
    width: 4px;
    height: 12px;
    background: #00e5ff;
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 2px;
    box-shadow: 0 0 6px #00e5ff;
}

/* Các icon quanh nút vặn trái */
.icons-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4px;
    font-size: 11px;
    color: #777;
}

.icons-grid i.active {
    color: #00e5ff;
    text-shadow: 0 0 5px rgba(0, 229, 255, 0.5);
}

/* Thang nhiệt độ quanh nút vặn phải */
.temp-labels {
    display: flex;
    flex-direction: column;
    font-size: 9px;
    color: #888;
    align-items: center;
    gap: 2px;
}

.highlight-temp {
    color: #ff9900;
    font-weight: bold;
    text-shadow: 0 0 5px rgba(255, 153, 0, 0.5);
}

/* Màn hình OLED Trung tâm */
.oled-screen {
    width: 250px;
    height: 90px;
    background: #05080a;
    border: 2px solid #1f2937;
    border-radius: 6px;
    padding: 6px 10px;
    color: #00e5ff;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.2);
}

.screen-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    border-bottom: 1px solid #11323f;
    padding-bottom: 2px;
}

.brand-mode {
    font-weight: bold;
    letter-spacing: 1px;
}

.wifi-icon {
    color: #00e5ff;
    font-size: 10px;
}

.screen-body {
    font-size: 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.status-row {
    display: flex;
    justify-content: space-between;
}

.label {
    color: #8a99ad;
}

.value {
    color: #fff;
}

.active-status {
    color: #ffcc00;
}

.screen-footer-icons {
    display: flex;
    justify-content: space-around;
    font-size: 11px;
    color: #557788;
    border-top: 1px solid #11323f;
    padding-top: 2px;
}

.screen-footer-icons i:hover {
    color: #00e5ff;
    cursor: pointer;
}

/* Cửa kính lò nướng */
.oven-door {
    background: #0a0a0a;
    position: relative;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.handle-bar {
    width: 350px;
    height: 12px;
    background: linear-gradient(to bottom, #dcdcdc, #888, #333);
    border-radius: 6px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.6);
    margin-bottom: 15px;
    cursor: pointer;
}

.window-glass {
    width: 100%;
    height: 280px;
    background: radial-gradient(circle, #3a2211 0%, #1a0f05 70%, #000 100%);
    border: 8px solid #1a1a1a;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
}

/* Ánh sáng và thực phẩm bên trong lò */
.interior-light {
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, rgba(255, 140, 0, 0.25) 0%, rgba(0,0,0,0.8) 80%);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.roasted-chicken {
    text-align: center;
    color: #ffaa33;
    animation: glowEffect 2s infinite alternate;
}

.roasted-chicken i {
    font-size: 45px;
    display: block;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 10px #ff6600);
}

.roasted-chicken span {
    font-size: 12px;
    letter-spacing: 0.5px;
    background: rgba(0,0,0,0.6);
    padding: 3px 8px;
    border-radius: 4px;
}

/* Hiệu ứng sáng lò */
@keyframes glowEffect {
    0% { opacity: 0.8; }
    100% { opacity: 1; text-shadow: 0 0 15px #ff9900; }
}

/* Logo thương hiệu dưới cửa lò */
.oven-brand {
    margin-top: 15px;
    text-align: center;
    color: #ccc;
}

.oven-brand span {
    display: block;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 2px;
}

.sub-brand {
    font-size: 10px !important;
    color: #777;
    letter-spacing: 1px !important;
}
    </style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Oven Control Panel</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome để dùng các icon trực quan -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="oven-container">
        <!-- Bảng điều khiển phía trên -->
        <div class="control-panel">
            
            <!-- Nút vặn bên trái: Chọn chức năng -->
            <div class="control-group">
                <div class="knob-container">
                    <div class="knob">
                        <div class="knob-indicator"></div>
                    </div>
                </div>
                <div class="icons-grid">
                    <i class="fa-solid fa-fire active" title="Nướng trên/dưới"></i>
                    <i class="fa-solid fa-wind" title="Đối lưu (Convection)"></i>
                    <i class="fa-solid fa-pizza-slice" title="Nướng Pizza"></i>
                    <i class="fa-solid fa-bacon" title="Nướng thanh nhiệt"></i>
                </div>
            </div>

            <!-- Màn hình OLED trung tâm -->
            <div class="oled-screen">
                <div class="screen-header">
                    <span class="brand-mode">SMART OVEN PRO</span>
                    <i class="fa-solid fa-wifi wifi-icon"></i>
                </div>
                <div class="screen-body">
                    <div class="status-row">
                        <span class="label">Chế độ:</span>
                        <span class="value">Nướng gà đối lưu</span>
                    </div>
                    <div class="status-row">
                        <span class="label">Thời gian:</span>
                        <span class="value">01:45 / 02:00 (180°C)</span>
                    </div>
                    <div class="status-row">
                        <span class="label">Trạng thái:</span>
                        <span class="value active-status">Đang nướng...</span>
                    </div>
                </div>
                <!-- Thanh công cụ cảm ứng phụ dưới màn hình -->
                <div class="screen-footer-icons">
                    <i class="fa-solid fa-lightbulb" title="Đèn lò"></i>
                    <i class="fa-solid fa-clock" title="Hẹn giờ"></i>
                    <i class="fa-solid fa-temperature-high" title="Cảm biến nhiệt"></i>
                    <i class="fa-solid fa-lock" title="Khóa trẻ em"></i>
                </div>
            </div>

            <!-- Nút vặn bên phải: Chỉnh nhiệt độ -->
            <div class="control-group">
                <div class="knob-container">
                    <div class="knob right-knob">
                        <div class="knob-indicator"></div>
                    </div>
                </div>
                <div class="temp-labels">
                    <span>50°C</span>
                    <span>100°C</span>
                    <span class="highlight-temp">180°C</span>
                    <span>230°C</span>
                    <span>250°C</span>
                </div>
            </div>

        </div>

        <!-- Cửa kính lò nướng (Hiệu ứng khoang lò bên trong) -->
        <div class="oven-door">
            <div class="handle-bar"></div>
            <div class="window-glass">
                <div class="interior-light">
                    <!-- Mô phỏng thực phẩm bên trong lò -->
                    <div class="roasted-chicken">
                        <i class="fa-solid fa-utensils"></i>
                        <span>Đang nướng gà vàng giòn</span>
                    </div>
                </div>
            </div>
            <div class="oven-brand">
                <span>Miele</span>
                <span class="sub-brand">Generation 7000</span>
            </div>
        </div>
    </div>

</body>
</html>
